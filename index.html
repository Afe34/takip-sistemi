<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YKS Sistemim</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Grafik Takibi için Chart.js Entegrasyonu -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Firebase SDK Entegrasyonu (Firestore) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
      import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBueJUyBtCForsQZcnIqcJ-0jLy5wLMDoQ",
        authDomain: "takip-788b9.firebaseapp.com",
        projectId: "takip-788b9",
        storageBucket: "takip-788b9.firebasestorage.app",
        messagingSenderId: "124800695899",
        appId: "1:124800695899:web:df9dcadd795626ef33097e",
        measurementId: "G-BPDN3RT6FC"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getFirestore(app);

      // Global olarak Firestore nesnesini ve fonksiyonları erişilebilir yapıyoruz
      window.db = db;
      window.fsDoc = doc;
      window.fsSetDoc = setDoc;
      window.fsOnSnapshot = onSnapshot;
    </script>

    <style>
        :root {
            --bg-color: #f7f9f6;
            --container-bg: #ffffff;
            --text-color: #2c3e50;
            --subtext-color: #7f8c8d;
            --input-bg: #f8fafc;
            --border-color: #e2e8f0;
            --item-hover: #f1f5f9;
            --accent-color: #10b981;
            --accent-hover: #059669;
            --completed-color: #a0aec0;
            --motivation-bg: #f0fdf4;
            --motivation-border: #bbf7d0;
            --drag-over-bg: #e2f0df;
            --danger-color: #e74c3c;
            --btn-green: #15803d;
            --btn-green-hover: #166534;
        }

        [data-theme="dark"] {
            --bg-color: #121824;
            --container-bg: #1e293b;
            --text-color: #f1f5f9;
            --subtext-color: #94a3b8;
            --input-bg: #0f172a;
            --border-color: #334155;
            --item-hover: #273548;
            --accent-color: #10b981;
            --accent-hover: #34d399;
            --completed-color: #64748b;
            --motivation-bg: #064e3b;
            --motivation-border: #065f46;
            --drag-over-bg: #1e3a2a;
            --danger-color: #ef4444;
            --btn-green: #15803d;
            --btn-green-hover: #166534;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 1300px; background-color: var(--container-bg); padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 700; }
        .header-right { display: flex; align-items: center; gap: 10px; }
        .sync-badge { font-size: 11px; font-weight: 600; padding: 5px 10px; border-radius: 20px; background-color: rgba(16, 185, 129, 0.1); color: var(--accent-color); border: 1px solid var(--accent-color); }
        .btn-icon { background-color: var(--input-bg); border: none; cursor: pointer; font-size: 14px; padding: 8px 12px; border-radius: 8px; color: var(--text-color); font-weight: 600; }

        .motivation-card { background-color: var(--motivation-bg); border: 1px solid var(--motivation-border); border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .target-section { flex: 1; min-width: 200px; }
        .target-label { font-size: 12px; text-transform: uppercase; font-weight: 700; color: var(--accent-color); margin-bottom: 4px; }
        .target-input { background: transparent; border: none; width: 100%; font-size: 16px; font-weight: 600; color: var(--text-color); outline: none; border-bottom: 1px dashed transparent; }
        .target-input:focus { border-bottom: 1px dashed var(--accent-color); }
        .countdown-section { text-align: right; padding-left: 16px; border-left: 1px solid var(--motivation-border); }
        .countdown-number { font-size: 20px; font-weight: 800; color: var(--accent-color); line-height: 1.2; margin-bottom: 2px; }
        .countdown-label { font-size: 11px; font-weight: 600; color: var(--subtext-color); text-transform: uppercase; }

        .tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; flex-wrap: wrap; }
        .tab-btn { background: none; border: none; font-size: 14px; font-weight: 600; color: var(--subtext-color); cursor: pointer; padding: 8px 12px; position: relative; border-radius: 6px; white-space: nowrap; }
        .tab-btn.active { color: var(--accent-color); background-color: var(--item-hover); }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -12px; left: 0; width: 100%; height: 3px; background-color: var(--accent-color); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-group { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .input-group input, .input-group select { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 14px; outline: none; flex: 1;}
        .input-group button { padding: 0 16px; border: none; border-radius: 8px; background-color: var(--accent-color); color: white; font-weight: 600; cursor: pointer; }

        .calendar-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; color: var(--subtext-color); font-weight: 600; }
        .calendar-nav button { background: none; border: none; color: var(--accent-color); font-size: 18px; cursor: pointer; }
        .drag-planner-container { display: flex; flex-direction: column; gap: 20px; }
        @media (min-width: 850px) { .drag-planner-container { flex-direction: row; } }
        .task-pool-sidebar { background-color: var(--item-hover); padding: 15px; border-radius: 12px; border: 1px dashed var(--border-color); display: flex; flex-direction: column; }
        @media (min-width: 850px) { .task-pool-sidebar { width: 320px; flex-shrink: 0; } }
        .sidebar-title { font-size: 14px; font-weight: 700; color: var(--accent-color); margin-bottom: 15px; text-transform: uppercase; display: flex; justify-content: space-between;}
        
        .week-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .day-column { background-color: var(--input-bg); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid transparent; }
        .day-column.today { border-color: var(--accent-color); }
        .day-header { padding: 12px; background-color: rgba(0,0,0,0.03); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .day-title-area { text-align: left; }
        .day-name { font-size: 13px; text-transform: uppercase; font-weight: 700; color: var(--subtext-color); }
        .day-date { font-size: 16px; font-weight: 800; margin-top: 2px; }
        .day-action-btns { display: flex; gap: 4px; }
        .day-note-btn { background: var(--container-bg); border: 1px solid var(--border-color); font-size: 11px; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: var(--text-color); font-weight: 600; }
        .day-note-btn:hover { background-color: var(--item-hover); color: var(--accent-color); }

        .day-note-drawer, .day-work-drawer { background-color: var(--container-bg); border-bottom: 1px solid var(--border-color); padding: 10px 12px; display: none; flex-direction: column; gap: 6px; }
        .day-note-drawer.open, .day-work-drawer.open { display: flex; }
        .day-note-textarea { width: 100%; height: 60px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 12px; resize: none; outline: none; }
        
        .work-summary-container { padding: 8px 12px; background-color: rgba(16, 185, 129, 0.05); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 4px; }
        .work-summary-title { font-size: 11px; font-weight: 700; color: var(--accent-color); display: flex; justify-content: space-between; align-items: center; }
        .work-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
        .work-pill { background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; color: var(--text-color); }
        .work-pill-delete { cursor: pointer; color: var(--subtext-color); font-weight: bold; margin-left: 2px; }
        .work-pill-delete:hover { color: var(--danger-color); }

        .drop-zone { flex: 1; padding: 14px; min-height: 350px; display: flex; flex-direction: column; gap: 12px; }
        .drop-zone.drag-over { background-color: var(--drag-over-bg); }
        .pool-zone { min-height: 350px; }

        .draggable-task { background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; font-size: 14px; cursor: grab; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .task-content { display: flex; align-items: flex-start; gap: 10px; word-break: break-word; }
        .task-content input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent-color); margin-top: 1px; cursor: pointer; flex-shrink: 0;}
        .draggable-task.completed .task-text { text-decoration: line-through; color: var(--completed-color); }
        .draggable-task.completed .task-subject-badge { opacity: 0.5; }
        .task-text { flex: 1; line-height: 1.4; pointer-events: none; font-weight: 500; }
        .task-subject-badge { font-size: 11px; font-weight: 700; color: var(--accent-color); background: var(--motivation-bg); padding: 2px 6px; border-radius: 4px; width: fit-content; margin-bottom: 2px; }
        .task-actions { display: flex; justify-content: flex-end; border-top: 1px solid var(--border-color); padding-top: 6px; margin-top: 2px; }
        .delete-btn { background: none; border: none; color: var(--subtext-color); cursor: pointer; font-size: 13px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
        .delete-btn:hover { background-color: rgba(231, 76, 60, 0.1); color: var(--danger-color); }
        .empty-text { font-size: 13px; color: var(--subtext-color); text-align: center; font-style: italic; margin-top: 20px;}

        .camp-card { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .camp-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .progress-bar-bg { background-color: var(--border-color); border-radius: 8px; height: 10px; width: 100%; overflow: hidden; margin-bottom: 12px; }
        .progress-bar-fill { background-color: var(--accent-color); height: 100%; width: 0%; transition: width 0.5s ease-in-out; }
        .camp-footer { display: flex; justify-content: space-between; align-items: center; color: var(--subtext-color); font-size: 13px; }
        .camp-controls button { background-color: var(--container-bg); border: 1px solid var(--border-color); color: var(--text-color); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-weight: bold; }

        .curriculum-toolbar { display: flex; gap: 10px; margin-bottom: 20px; justify-content: space-between; align-items: center; }
        .curriculum-search { padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); outline: none; min-width: 250px; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
        .course-card { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; }
        .course-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .course-badge { background-color: var(--accent-color); color: white; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 12px; }
        .topic-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 420px; overflow-y: auto; }
        .topic-item { background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
        .topic-stages { display: flex; gap: 12px; font-size: 12px; color: var(--subtext-color); }
        .stage-label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

        .spaced-container { display: flex; flex-direction: column; gap: 20px; }
        .spaced-section-title { font-size: 16px; font-weight: 700; color: var(--accent-color); margin-bottom: 12px; display: flex; justify-content: space-between; }
        .spaced-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        .spaced-card { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
        .spaced-card.due { border-color: var(--accent-color); background-color: var(--container-bg); }
        .spaced-actions { display: flex; gap: 8px; margin-top: 5px; }
        .btn-spaced-fail { flex: 1; background-color: rgba(231, 76, 60, 0.1); border: 1px solid var(--danger-color); color: var(--danger-color); font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer; }
        .btn-spaced-success { flex: 1.5; background-color: var(--accent-color); border: none; color: white; font-weight: 600; padding: 8px; border-radius: 8px; cursor: pointer; }

        .error-layout { display: flex; flex-direction: column; gap: 24px; }
        @media (min-width: 850px) { .error-layout { flex-direction: row; align-items: flex-start; } }
        .error-form-card { width: 100%; max-width: 380px; background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .error-form-title { font-size: 16px; font-weight: 700; margin-bottom: 18px; }
        .form-field { margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
        .form-field label { font-size: 13px; font-weight: 600; color: var(--subtext-color); }
        .form-field input, .form-field select, .form-field textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--container-bg); color: var(--text-color); font-size: 14px; outline: none; }
        .btn-add-error { width: 100%; padding: 12px; background-color: var(--btn-green); color: white; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .btn-add-error:hover { background-color: var(--btn-green-hover); }
        .error-list-card { flex: 1; width: 100%; background-color: var(--container-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; min-height: 400px; }
        .error-items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
        .error-card-item { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
        .error-card-item.resolved { opacity: 0.6; border-style: dashed; }
        .error-img-preview { width: 100%; max-height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border-color); cursor: pointer; }

        .error-filter-panel { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        .error-filter-btn { background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; user-select: none; }
        .error-filter-btn:hover { background-color: var(--item-hover); }
        .error-filter-btn.active { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        
        .image-modal { display: none; position: fixed; z-index: 10000; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; }
        .image-modal img { max-width: 90%; max-height: 90vh; border-radius: 8px; }
        .image-modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 35px; font-weight: bold; cursor: pointer; }

        .exam-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 900px) { .exam-grid { grid-template-columns: 340px 1fr; } }
        .exam-inputs-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .chart-container { background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; height: 380px; position: relative; display: flex; flex-direction: column; }
        .chart-filter-btn { background-color: var(--container-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .chart-filter-btn.active { background-color: var(--accent-color); color: white; border-color: var(--accent-color); }
        
        .pomodoro-box { display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; max-width: 500px; margin: 0 auto; text-align: center; }
        .pomodoro-timer { font-size: 64px; font-weight: 800; color: var(--accent-color); margin: 20px 0; font-family: monospace; }
        .pomodoro-btns { display: flex; gap: 12px; width: 100%; }
        .pomodoro-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <div class="header">
            <h1>YKS Sistemim</h1>
            <div class="header-right">
                <span id="cloudSyncStatus" class="sync-badge">Bulut: Bağlanıyor...</span>
                <button class="btn-icon" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
            </div>
        </div>

        <div class="motivation-card">
            <div class="target-section">
                <div class="target-label">Ana Hedefim</div>
                <input type="text" class="target-input" id="targetGoal" onchange="saveGoal()" placeholder="Hedefini buraya yaz...">
            </div>
            <div class="countdown-section">
                <div class="countdown-number" id="countdownDays">-- Gün -- Saat</div>
                <div class="countdown-label">YKS 2027 (19 Haziran 2027)</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(this, 'planner')">🗓️ Haftalık Plan</button>
            <button class="tab-btn" onclick="switchTab(this, 'curriculum')">📑 Müfredat Matrisi</button>
            <button class="tab-btn" onclick="switchTab(this, 'spaced')">🧠 Aralıklarla Tekrar</button>
            <button class="tab-btn" onclick="switchTab(this, 'errors')">📌 Fotoğraflı Hata Defteri</button>
            <button class="tab-btn" onclick="switchTab(this, 'camps')">📚 Kaynak Takibi</button>
            <button class="tab-btn" onclick="switchTab(this, 'books')">📖 Soru Bankaları</button>
            <button class="tab-btn" onclick="switchTab(this, 'exams')">📊 Deneme Takibi</button>
            <button class="tab-btn" onclick="switchTab(this, 'pomodoro')">⏱️ Sayaç</button>
        </div>

        <!-- HAFTALIK PLAN -->
        <div id="plannerTab" class="tab-content active">
            <div class="calendar-nav">
                <button onclick="changeWeek(-1)">◀ Önceki</button>
                <span id="weekDisplay" onclick="goToCurrentWeek()" style="cursor:pointer; color:var(--text-color);"></span>
                <button onclick="changeWeek(1)">Sonraki ▶</button>
            </div>
            <div class="drag-planner-container">
                <div class="task-pool-sidebar">
                    <div class="sidebar-title">Haftalık Görev Havuzu <span id="poolCount">0</span></div>
                    
                    <div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;">
                        <select id="poolSubject" style="padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); font-size: 14px; outline: none;">
                            <option value="Matematik">Matematik</option>
                            <option value="Geometri">Geometri</option>
                            <option value="Fizik">Fizik</option>
                            <option value="Kimya">Kimya</option>
                            <option value="Biyoloji">Biyoloji</option>
                            <option value="Türkçe">Türkçe</option>
                            <option value="Sosyal">Sosyal</option>
                            <option value="Genel">Genel / Diğer</option>
                        </select>
                        <div class="input-group" style="margin-bottom: 0;">
                            <input type="text" id="poolInput" placeholder="Örn: 50 soru çözüm..." onkeypress="if(event.key === 'Enter') addPoolTask()">
                            <input type="number" id="poolRepeat" value="1" min="1" max="14" style="width: 50px; text-align: center;" title="Tekrar Sayısı">
                            <button onclick="addPoolTask()">+</button>
                        </div>
                    </div>

                    <div class="drop-zone pool-zone" id="zone-pool" ondrop="drop(event, 'pool')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)"></div>
                </div>
                <div class="week-grid" id="weekGrid"></div>
            </div>
        </div>

        <!-- MÜFREDAT MATRİSİ -->
        <div id="curriculumTab" class="tab-content">
            <div class="curriculum-toolbar">
                <input type="text" id="curriculumSearch" class="curriculum-search" placeholder="Konu ara..." oninput="renderCurriculum()">
                <button class="btn-icon" onclick="resetCurriculumConfirm()">🔄 İşaretleri Sıfırla</button>
            </div>
            <div class="course-grid" id="curriculumGrid"></div>
        </div>

        <!-- ARALIKLARLA TEKRAR -->
        <div id="spacedTab" class="tab-content">
            <div class="input-group">

    <script>
        // ================= FIREBASE CLOUD SYNC ENTEGRASYONU =================
        let isCloudLoading = false;

        function saveToCloudAndLocal(key, data) {
            localStorage.setItem(key, JSON.stringify(data));

            if (window.db && window.fsDoc && window.fsSetDoc && !isCloudLoading) {
                const statusBadge = document.getElementById('cloudSyncStatus');
                if(statusBadge) {
                    statusBadge.innerText = "Bulut: Kaydediliyor...";
                    statusBadge.style.color = "#f59e0b";
                    statusBadge.style.borderColor = "#f59e0b";
                }

                window.fsSetDoc(window.fsDoc(window.db, "yks_sistemim", key), {
                    payload: data,
                    updatedAt: new Date().toISOString()
                }).then(() => {
                    if(statusBadge) {
                        statusBadge.innerText = "Bulut: Senkronize";
                        statusBadge.style.color = "var(--accent-color)";
                        statusBadge.style.borderColor = "var(--accent-color)";
                    }
                }).catch(err => {
                    console.error("Bulut kayıt hatası:", err);
                    if(statusBadge) {
                        statusBadge.innerText = "Bulut: Hata!";
                        statusBadge.style.color = "#ef4444";
                        statusBadge.style.borderColor = "#ef4444";
                    }
                });
            }
        }

        function initCloudSyncFor(key, renderCallback) {
            let localVal = localStorage.getItem(key);
            if (localVal) {
                renderCallback(JSON.parse(localVal));
            }

            const checkDbInterval = setInterval(() => {
                if (window.db && window.fsDoc && window.fsOnSnapshot) {
                    clearInterval(checkDbInterval);
                    const statusBadge = document.getElementById('cloudSyncStatus');
                    if(statusBadge) {
                        statusBadge.innerText = "Bulut: Bağlandı";
                    }

                    window.fsOnSnapshot(window.fsDoc(window.db, "yks_sistemim", key), (docSnap) => {
                        if (docSnap.exists()) {
                            const cloudData = docSnap.data().payload;
                            if (cloudData) {
                                isCloudLoading = true;
                                localStorage.setItem(key, JSON.stringify(cloudData));
                                renderCallback(cloudData);
                                isCloudLoading = false;
                                
                                if(statusBadge) {
                                    statusBadge.innerText = "Bulut: Güncel";
                                    statusBadge.style.color = "var(--accent-color)";
                                    statusBadge.style.borderColor = "var(--accent-color)";
                                }
                            }
                        }
                    }, (error) => {
                        console.error("Bulut dinleme hatası:", error);
                        if(statusBadge) {
                            statusBadge.innerText = "Bulut: Bağlantı Yok";
                            statusBadge.style.color = "#ef4444";
                            statusBadge.style.borderColor = "#ef4444";
                        }
                    });
                }
            }, 500);
        }

        // ================= TEMEL UYGULAMA MANTIĞI =================
        const savedTheme = localStorage.getItem('yks_theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('themeToggleBtn');
            if(btn) btn.innerText = savedTheme === 'dark' ? '☀️' : '🌙';
            toggleExamFields();

            const examDateInput = document.getElementById('examDate');
            if (examDateInput) {
                const today = new Date().toISOString().split('T')[0];
                examDateInput.value = today;
            }

            initCloudSyncFor('yks_drag_planner', (data) => { plannerData = data; renderPlanner(); });
            initCloudSyncFor('yks_day_notes', (data) => { dayNotesData = data; renderPlanner(); });
            initCloudSyncFor('yks_work_logs', (data) => { workLogsData = data; renderPlanner(); });
            
            initCurriculumData();
            initCloudSyncFor('yks_curriculum_matrix', (data) => { 
                mergeCurriculumProgress(data); 
                renderCurriculum(); 
            });
            
            initCloudSyncFor('yks_spaced_data', (data) => { spacedData = data; renderSpaced(); });
            initCloudSyncFor('yks_error_data', (data) => { errorData = data; renderErrorLog(); });
            initCloudSyncFor('yks_camps_data', (data) => { campsData = data; renderCamps(); });
            initCloudSyncFor('yks_books_data', (data) => { bookData = data; renderBooks(); });
            initCloudSyncFor('yks_exam_data', (data) => { examData = data; renderExams(); });
            
            updatePomoDisplay();
        });

        const yks2027Target = new Date('2027-06-19T10:15:00').getTime(); 
        
        function updateMotivationPanel() {
            const now = new Date().getTime();
            const timeDiff = yks2027Target - now;

            if (timeDiff > 0) {
                const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);

                document.getElementById('countdownDays').innerText = `${days} gün ${hours} sa ${minutes} dk ${seconds} sn`;
            } else {
                document.getElementById('countdownDays').innerText = "Sınav Günü Geldi!";
            }

            const savedGoal = localStorage.getItem('yks_target_goal');
            const targetInput = document.getElementById('targetGoal');
            if (!targetInput.value) {
                targetInput.value = savedGoal ? savedGoal : "İstanbul - Tıp veya İng. Endüstri Müh.";
            }
            if(!savedGoal && !localStorage.getItem('yks_target_goal')) saveGoal();
        }

        setInterval(updateMotivationPanel, 1000);
        updateMotivationPanel();

        function saveGoal() { 
            saveToCloudAndLocal('yks_target_goal', document.getElementById('targetGoal').value); 
        }

        function toggleTheme() {
            const body = document.body; 
            const btn = document.getElementById('themeToggleBtn');
            let currentTheme = body.getAttribute('data-theme');
            
            if (currentTheme === 'light') { 
                body.setAttribute('data-theme', 'dark'); 
                localStorage.setItem('yks_theme', 'dark');
                btn.innerText = '☀️'; 
            } else { 
                body.setAttribute('data-theme', 'light'); 
                localStorage.setItem('yks_theme', 'light');
                btn.innerText = '🌙'; 
            }
            updateChartTheme();
        }

        function updateChartTheme() {
            if (!examChartInstance) return;
            renderExamChart();
        }

        function switchTab(btnElement, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId + 'Tab').classList.add('active');
            btnElement.classList.add('active');
            if(tabId === 'exams') renderExams();
        }

        function escapeHtml(text) {
            if(!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        /* ================= HAFTALIK PLAN & GÜNLÜK NOTLAR & ÇALIŞMA LOGLARI ================= */
        let currentWeekStart = getMonday(new Date());
        let plannerData = JSON.parse(localStorage.getItem('yks_drag_planner')) || { pool: {}, days: {} };
        let dayNotesData = JSON.parse(localStorage.getItem('yks_day_notes')) || {};
        let workLogsData = JSON.parse(localStorage.getItem('yks_work_logs')) || {}; 
        const dayNames = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
        const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

        function formatDateString(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }
        function getMonday(d) { d = new Date(d); let day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1); d.setDate(diff); d.setHours(0,0,0,0); return d; }
        function changeWeek(offset) { currentWeekStart.setDate(currentWeekStart.getDate() + (offset * 7)); renderPlanner(); }
        function goToCurrentWeek() { currentWeekStart = getMonday(new Date()); renderPlanner(); }
        
        function savePlanner() { 
            saveToCloudAndLocal('yks_drag_planner', plannerData); 
        }

        function toggleDayNoteDrawer(dateStr) {
            const drawer = document.getElementById(`drawer-${dateStr}`);
            if (drawer) drawer.classList.toggle('open');
        }

        function toggleDayWorkDrawer(dateStr) {
            const drawer = document.getElementById(`work-drawer-${dateStr}`);
            if (drawer) drawer.classList.toggle('open');
        }

        function saveDayNote(dateStr) {
            const textarea = document.getElementById(`note-input-${dateStr}`);
            if (textarea) {
                dayNotesData[dateStr] = textarea.value;
                saveToCloudAndLocal('yks_day_notes', dayNotesData);
            }
        }

        function addWorkLog(dateStr) {
            const subjectSelect = document.getElementById(`work-subj-${dateStr}`);
            const hoursInput = document.getElementById(`work-hrs-${dateStr}`);
            const minsInput = document.getElementById(`work-mins-${dateStr}`);

            const subject = subjectSelect ? subjectSelect.value : 'Matematik';
            const hours = parseFloat(hoursInput ? hoursInput.value : 0) || 0;
            const mins = parseFloat(minsInput ? minsInput.value : 0) || 0;

            const totalHours = hours + (mins / 60);
            if (totalHours <= 0) {
                alert("Lütfen geçerli bir çalışma süresi girin.");
                return;
            }

            if (!workLogsData[dateStr]) workLogsData[dateStr] = [];
            workLogsData[dateStr].push({
                id: Date.now(),
                subject: subject,
                hours: parseFloat(totalHours.toFixed(2))
            });

            if (hoursInput) hoursInput.value = '';
            if (minsInput) minsInput.value = '';

            saveToCloudAndLocal('yks_work_logs', workLogsData);
            renderPlanner();
        }

        function deleteWorkLog(dateStr, id) {
            if (workLogsData[dateStr]) {
                workLogsData[dateStr] = workLogsData[dateStr].filter(item => item.id !== id);
                if (workLogsData[dateStr].length === 0) delete workLogsData[dateStr];
                saveToCloudAndLocal('yks_work_logs', workLogsData);
                renderPlanner();
            }
        }

        function addPoolTask() {
            const input = document.getElementById('poolInput');
            const subjectSelect = document.getElementById('poolSubject');
            const repeatInput = document.getElementById('poolRepeat');
            const text = input.value.trim();
            if(text === '') return;
            let subject = subjectSelect.value;
            let repeatCount = parseInt(repeatInput.value) || 1;
            const weekKey = formatDateString(currentWeekStart);
            if(!plannerData.pool[weekKey]) plannerData.pool[weekKey] = [];
            
            for(let i = 0; i < repeatCount; i++) {
                let taskText = repeatCount > 1 ? `${text} (${i + 1}/${repeatCount})` : text;
                plannerData.pool[weekKey].push({ id: Date.now() + i, subject: subject, text: taskText, completed: false });
            }
            input.value = ''; repeatInput.value = 1; savePlanner(); renderPlanner();
        }

        function toggleTaskDrag(id, source) {
            let taskList = source === 'pool' ? plannerData.pool[formatDateString(currentWeekStart)] : plannerData.days[source];
            if(taskList) { 
                const task = taskList.find(t => t.id == id); 
                if(task) { 
                    task.completed = !task.completed; 
                    if(task.completed) triggerConfetti();
                    savePlanner(); renderPlanner(); 
                } 
            }
        }

        function deleteTaskDrag(id, source) {
            if(source === 'pool') { const weekKey = formatDateString(currentWeekStart); plannerData.pool[weekKey] = plannerData.pool[weekKey].filter(t => t.id != id); } 
            else { plannerData.days[source] = plannerData.days[source].filter(t => t.id != id); }
            savePlanner(); renderPlanner();
        }

        function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add('drag-over'); }
        function dragLeave(ev) { ev.currentTarget.classList.remove('drag-over'); }
        function drag(ev, taskId, source) { ev.dataTransfer.setData("taskId", taskId); ev.dataTransfer.setData("source", source); }

        function drop(ev, targetZone) {
            ev.preventDefault();
            document.querySelectorAll('.drop-zone').forEach(el => el.classList.remove('drag-over'));
            const taskId = ev.dataTransfer.getData("taskId"); const sourceZone = ev.dataTransfer.getData("source");
            if(sourceZone === targetZone) return; 
            let taskToMove = null; const weekKey = formatDateString(currentWeekStart);

            if(sourceZone === 'pool') {
                if(plannerData.pool[weekKey]) {
                    const idx = plannerData.pool[weekKey].findIndex(t => t.id == taskId);
                    if(idx > -1) taskToMove = plannerData.pool[weekKey].splice(idx, 1)[0];
                }
            } else {
                if(plannerData.days[sourceZone]) {
                    const idx = plannerData.days[sourceZone].findIndex(t => t.id == taskId);
                    if(idx > -1) taskToMove = plannerData.days[sourceZone].splice(idx, 1)[0];
                }
            }
            if(!taskToMove) return;

            if(targetZone === 'pool') {
                if(!plannerData.pool[weekKey]) plannerData.pool[weekKey] = [];
                plannerData.pool[weekKey].push(taskToMove);
            } else {
                if(!plannerData.days[targetZone]) plannerData.days[targetZone] = [];
                plannerData.days[targetZone].push(taskToMove);
            }
            savePlanner(); renderPlanner();
        }

            return `

                    ${task.subject ? `<div class="task-subject-badge">${escapeHtml(task.subject)}</div>` : ''}
                    <div class="task-content" onclick="toggleTaskDrag(${task.id}, '${sourceStr}')">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="event.stopPropagation(); toggleTaskDrag(${task.id}, '${sourceStr}')">
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                    <div class="task-actions">
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteTaskDrag(${task.id}, '${sourceStr}')">Sil</button>
                    </div>
                </div>`;
        }

        let curriculumData = {};

        function initCurriculumData() {
            curriculumData = {};
            orderedCurriculumStructure.forEach(item => {
                curriculumData[item.category] = {};
                item.topics.forEach(topic => {
                    curriculumData[item.category][topic] = { konu: false, soru: false, tekrar: false };
                });
            });
        }

        function mergeCurriculumProgress(savedData) {
            initCurriculumData();
            if (!savedData) return;
            for (let course in savedData) {
                if (curriculumData[course]) {
                    for (let topic in savedData[course]) {
                        if (curriculumData[course][topic]) {
                            curriculumData[course][topic] = savedData[course][topic];
                        }
                    }
                }
            }
        }

            saveToCloudAndLocal('yks_curriculum_matrix', curriculumData);

        function toggleStage(course, topic, stage) {
            if (curriculumData[course] && curriculumData[course][topic]) {
                curriculumData[course][topic][stage] = !curriculumData[course][topic][stage];
                saveCurriculum(); renderCurriculum();
            }
        }

        function calculateCourseProgress(course) {
            const topics = curriculumData[course];
            if (!topics) return 0;
            const topicKeys = Object.keys(topics);
            if (topicKeys.length === 0) return 0;
            let totalStages = topicKeys.length * 3;
            let completedStages = 0;
            topicKeys.forEach(t => {
                if (topics[t].konu) completedStages++;
                if (topics[t].soru) completedStages++;
                if (topics[t].tekrar) completedStages++;
            });
            return Math.round((completedStages / totalStages) * 100);
        }

        function reviewSpacedItem(id, remembered) {
            const item = spacedData.find(i => i.id === id);
            if (!item) return;
            const today = new Date(); today.setHours(0,0,0,0);

            if (remembered) {
                if (item.stage < spacedIntervals.length - 1) item.stage++;
                let addDays = spacedIntervals[Math.min(item.stage, spacedIntervals.length - 1)];
                let nextDate = new Date(today); nextDate.setDate(nextDate.getDate() + addDays);
                item.nextReviewDate = nextDate.toISOString();
                triggerConfetti();
            } else {
                item.stage = 0;
                let nextDate = new Date(today); nextDate.setDate(nextDate.getDate() + 1);
                item.nextReviewDate = nextDate.toISOString();
            }
            saveSpacedData(); renderSpaced();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                if (!file) { resolve(null); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        if (width > 800) { height = Math.round((height * 800) / width); width = 800; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.65));
                    };
                };
            });
        }

            if (topic === '') { alert('Lütfen konu başlığını girin.'); return; }
            let imageData = await compressImage(file);

            errorData.unshift({ id: Date.now(), subject: subject, topic: topic, reason: reason, image: imageData, resolved: false, date: new Date().toLocaleDateString('tr-TR') });
            document.getElementById('errTopic').value = ''; document.getElementById('errReason').value = ''; document.getElementById('errImage').value = '';
            saveErrorData(); renderErrorLog();
        }

        function toggleErrorResolved(id) {
            const item = errorData.find(e => e.id === id);
            if (item) { item.resolved = !item.resolved; if (item.resolved) triggerConfetti(); saveErrorData(); renderErrorLog(); }
        }

        function deleteErrorItem(id) {
            if (confirm('Bu hatayı defterden silmek istediğine emin misin?')) {
                errorData = errorData.filter(e => e.id !== id); saveErrorData(); renderErrorLog();
            }
        }

        function openImageModal(imgSrc) { document.getElementById('modalImg').src = imgSrc; document.getElementById('imageModal').style.display = 'flex'; }
        function closeImageModal() { document.getElementById('imageModal').style.display = 'none'; }

        function toggleErrorFilter(subject) {
            if (subject === 'ALL') {
                selectedErrorSubjects = [];
            } else {
                const index = selectedErrorSubjects.indexOf(subject);
                if (index > -1) selectedErrorSubjects.splice(index, 1);
                else selectedErrorSubjects.push(subject);
            }
            updateErrorFilterButtons();
            renderErrorLog();
        }

        function updateErrorFilterButtons() {
            const buttons = document.querySelectorAll('#errorFilterPanel .error-filter-btn');
            buttons.forEach(btn => {
                const subj = btn.getAttribute('data-subject');
                if (subj === 'ALL') {
                    if (selectedErrorSubjects.length === 0) btn.classList.add('active');
                    else btn.classList.remove('active');
                } else {
                    if (selectedErrorSubjects.includes(subj)) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            });
        }

        function renderErrorLog() {
            const grid = document.getElementById('errorGrid');
            const searchEl = document.getElementById('errSearch');
            const countEl = document.getElementById('errCount');
            if (!grid || !searchEl || !countEl) return;
            
            const filter = searchEl.value.toLowerCase().trim();
            grid.innerHTML = '';

            const filtered = errorData.filter(i => {
                const matchesSubject = selectedErrorSubjects.length === 0 || selectedErrorSubjects.includes(i.subject);
                const matchesSearch = filter === '' || i.topic.toLowerCase().includes(filter) || i.subject.toLowerCase().includes(filter) || (i.reason && i.reason.toLowerCase().includes(filter));
                return matchesSubject && matchesSearch;
            });

            countEl.innerText = filtered.length;

            if (filtered.length === 0) { grid.innerHTML = '<div class="empty-text">Filtreye uygun soru bulunamadı.</div>'; return; }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="error-card-item ${item.resolved ? 'resolved' : ''}">
                        ${item.image ? `<img src="${item.image}" class="error-img-preview" onclick="openImageModal('${item.image}')">` : ''}
                        <div style="font-size: 11px; font-weight: 700; color: var(--accent-color);">${escapeHtml(item.subject)}</div>
                        <div style="font-weight: 700; font-size: 14px;">${escapeHtml(item.topic)}</div>
                        ${item.reason ? `<div style="font-size: 13px; color: var(--subtext-color);">${escapeHtml(item.reason)}</div>` : ''}
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px;">
                            <label class="stage-label"><input type="checkbox" ${item.resolved ? 'checked' : ''} onchange="toggleErrorResolved(${item.id})"> Çözüldü</label>
                            <button class="delete-btn" onclick="deleteErrorItem(${item.id})">Sil</button>
                        </div>
                    </div>`;
            });
        }

        /* ================= KAYNAK TAKİBİ LOGIC ================= */
        let campsData = JSON.parse(localStorage.getItem('yks_camps_data')) || [];

        function addCamp() {
            const name = document.getElementById('campName').value.trim();
            const total = parseInt(document.getElementById('campTotal').value);
            if (name === '' || isNaN(total) || total <= 0) return;
            campsData.push({ id: Date.now(), name: name, type: document.getElementById('campType').value, total: total, completed: 0 });
            document.getElementById('campName').value = ''; document.getElementById('campTotal').value = '';
            saveAndRenderCamps();
        }

        function updateCamp(id, change) {
            const camp = campsData.find(c => c.id === id);
            if (camp) { camp.completed += change; if (camp.completed < 0) camp.completed = 0; if (camp.completed > camp.total) camp.completed = camp.total; saveAndRenderCamps(); }
        }
        function deleteCamp(id) { if(confirm('Silmek istediğine emin misin?')) { campsData = campsData.filter(c => c.id !== id); saveAndRenderCamps(); } }
        
        function saveAndRenderCamps() { 
            saveToCloudAndLocal('yks_camps_data', campsData); 
            renderCamps(); 
        }

        function renderCamps() {
            const list = document.getElementById('campList'); 
            if (!list) return;
            list.innerHTML = '';
            if (campsData.length === 0) { list.innerHTML = '<div class="empty-text">Takip edilecek kamp eklenmedi.</div>'; return; }
            campsData.forEach(camp => {
                const percent = Math.round((camp.completed / camp.total) * 100);
                list.innerHTML += `
                    <div class="camp-card">
                        <div class="camp-header">
                            <span style="font-weight:600;">${escapeHtml(camp.name)}</span>
                            <button class="delete-btn" onclick="deleteCamp(${camp.id})">✕</button>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
                        <div class="camp-footer">
                            <span>%${percent} (${camp.completed} / ${camp.total} ${camp.type})</span>
                            <div class="camp-controls"><button onclick="updateCamp(${camp.id}, -1)">-</button> <button onclick="updateCamp(${camp.id}, 1)">+</button></div>
                        </div>
                    </div>`;
            });
        }

        /* ================= SORU BANKALARI / YAYIN TAKİBİ LOGIC ================= */
        let bookData = JSON.parse(localStorage.getItem('yks_books_data')) || [];

        function saveAndRenderBooks() { 
            saveToCloudAndLocal('yks_books_data', bookData); 
            renderBooks(); 
        }

        function addBook() {
            const title = document.getElementById('bookTitle').value.trim();
            const subject = document.getElementById('bookSubject').value;
            const total = parseInt(document.getElementById('bookTotalTests').value);

            if (!title || isNaN(total) || total <= 0) return;

            bookData.push({ id: Date.now(), title: title, subject: subject, total: total, completed: 0 });
            document.getElementById('bookTitle').value = ''; document.getElementById('bookTotalTests').value = '';
            saveAndRenderBooks();
        }

        function updateBook(id, change) {
            const book = bookData.find(b => b.id === id);
            if (book) {
                book.completed += change;
                if (book.completed < 0) book.completed = 0;
                if (book.completed > book.total) book.completed = book.total;
                saveAndRenderBooks();
            }
        }

        function deleteBook(id) {
            if (confirm('Bu soru bankasını silmek istediğine emin misin?')) {
                bookData = bookData.filter(b => b.id !== id);
                saveAndRenderBooks();
            }
        }

        function renderBooks() {
            const list = document.getElementById('bookList'); 
            if (!list) return;
            list.innerHTML = '';
            if (bookData.length === 0) { list.innerHTML = '<div class="empty-text">Henüz soru bankası eklenmedi.</div>'; return; }

            bookData.forEach(book => {
                const percent = Math.round((book.completed / book.total) * 100);
                list.innerHTML += `
                    <div class="camp-card">
                        <div class="camp-header">
                            <div>
                                <span style="font-size:11px; font-weight:700; color:var(--accent-color); display:block;">${escapeHtml(book.subject)}</span>
                                <span style="font-weight:600;">${escapeHtml(book.title)}</span>
                            </div>
                            <button class="delete-btn" onclick="deleteBook(${book.id})">✕</button>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
                        <div class="camp-footer">
                            <span>%${percent} (${book.completed} / ${book.total} Test Bitti)</span>
                            <div class="camp-controls">
                                <button onclick="updateBook(${book.id}, -1)">-</button>
                                <button onclick="updateBook(${book.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        /* ================= DENEME TAKİP LOGIC & CHART ================= */
        let examData = JSON.parse(localStorage.getItem('yks_exam_data')) || [];
        let examChartInstance = null;
        let currentExamChartFilter = 'TYT';
        let editingExamId = null;

        function setChartFilter(filterType) {
            currentExamChartFilter = filterType;
            document.querySelectorAll('.chart-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (filterType === 'TYT') document.getElementById('chartFilterTYT').classList.add('active');
            if (filterType === 'AYT') document.getElementById('chartFilterAYT').classList.add('active');
            if (filterType === 'ALL') document.getElementById('chartFilterAll').classList.add('active');
            renderExamChart();
        }

        function toggleExamFields() {
            const typeEl = document.getElementById('examType');
            if (!typeEl) return;
            const type = typeEl.value;
            document.getElementById('tytFields').style.display = type === 'TYT' ? 'block' : 'none';
            document.getElementById('aytFields').style.display = type === 'AYT' ? 'block' : 'none';
        }

        function formatDateForDisplay(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}.${parts[1]}.${parts[0]}`;
            return dateStr;
        }

        function parseExamDetails(detailsStr, type) {
            const res = {};
            if (!detailsStr) return res;
            const parts = detailsStr.split('|').map(s => s.trim());
            parts.forEach(p => {
                const kv = p.split(':').map(s => s.trim());
                if (kv.length === 2) res[kv[0]] = parseFloat(kv[1]) || 0;
            });
            return res;
        }

        function editExam(id) {
            const exam = examData.find(e => e.id === id);
            if (!exam) return;

            editingExamId = id;
            document.getElementById('examFormTitle').innerText = 'Deneme Düzenle';
            document.getElementById('btnSaveExam').innerText = 'Değişiklikleri Kaydet';
            document.getElementById('btnCancelEditExam').style.display = 'block';

            document.getElementById('examName').value = exam.name || '';
            document.getElementById('examDate').value = exam.date || '';
            document.getElementById('examType').value = exam.type || 'TYT';
            toggleExamFields();

            const details = parseExamDetails(exam.details, exam.type);
            if (exam.type === 'TYT') {
                document.getElementById('netTR').value = details['TR'] !== undefined ? details['TR'] : 0;
                document.getElementById('netSOS').value = details['SOS'] !== undefined ? details['SOS'] : 0;
                document.getElementById('netMAT').value = details['MAT'] !== undefined ? details['MAT'] : 0;
                document.getElementById('netFEN').value = details['FEN'] !== undefined ? details['FEN'] : 0;
            } else {
                document.getElementById('netAytMAT').value = details['MAT'] !== undefined ? details['MAT'] : 0;
                document.getElementById('netAytFIZ').value = details['FİZ'] !== undefined ? details['FİZ'] : 0;
                document.getElementById('netAytKIM').value = details['KİM'] !== undefined ? details['KİM'] : 0;
                document.getElementById('netAytBIO').value = details['BİO'] !== undefined ? details['BİO'] : 0;
            }

            document.getElementById('examName').focus();
        }

        function cancelExamEdit() {
            editingExamId = null;
            document.getElementById('examFormTitle').innerText = 'Yeni Deneme Kaydet';
            document.getElementById('btnSaveExam').innerText = 'Denemeyi Kaydet';
            document.getElementById('btnCancelEditExam').style.display = 'none';

            document.getElementById('examName').value = '';
            document.getElementById('examDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('examType').value = 'TYT';
            toggleExamFields();

            document.getElementById('netTR').value = 0;
            document.getElementById('netSOS').value = 0;
            document.getElementById('netMAT').value = 0;
            document.getElementById('netFEN').value = 0;
            document.getElementById('netAytMAT').value = 0;
            document.getElementById('netAytFIZ').value = 0;
            document.getElementById('netAytKIM').value = 0;
            document.getElementById('netAytBIO').value = 0;
        }

        function addExamResult() {
            const name = document.getElementById('examName').value.trim();
            const type = document.getElementById('examType').value;
            const dateVal = document.getElementById('examDate').value;

            if (!name) { alert('Lütfen deneme adını girin.'); return; }
            if (!dateVal) { alert('Lütfen deneme tarihini seçin.'); return; }

            let result = { 
                id: editingExamId ? editingExamId : Date.now(), 
                name: name, 
                type: type, 
                date: dateVal 
            };

            if (type === 'TYT') {
                const tr = parseFloat(document.getElementById('netTR').value) || 0;
                const sos = parseFloat(document.getElementById('netSOS').value) || 0;
                const mat = parseFloat(document.getElementById('netMAT').value) || 0;
                const fen = parseFloat(document.getElementById('netFEN').value) || 0;

                if (tr < 0 || tr > 40 || sos < 0 || sos > 20 || mat < 0 || mat > 40 || fen < 0 || fen > 20) {
                    alert('Lütfen derslerin soru sayılarına uygun geçerli bir net girin!\n(Türkçe: Max 40, Sosyal: Max 20, Mat: Max 40, Fen: Max 20)');
                    return;
                }

                result.total = tr + sos + mat + fen;
                result.details = `TR: ${tr} | SOS: ${sos} | MAT: ${mat} | FEN: ${fen}`;
            } else {
                const mat = parseFloat(document.getElementById('netAytMAT').value) || 0;
                const fiz = parseFloat(document.getElementById('netAytFIZ').value) || 0;
                const kim = parseFloat(document.getElementById('netAytKIM').value) || 0;
                const bio = parseFloat(document.getElementById('netAytBIO').value) || 0;

                if (mat < 0 || mat > 40 || fiz < 0 || fiz > 14 || kim < 0 || kim > 13 || bio < 0 || bio > 13) {
                    alert('Lütfen AYT derslerinin soru sayılarına uygun geçerli bir net girin!\n(Mat: Max 40, Fizik: Max 14, Kimya: Max 13, Biyo: Max 13)');
                    return;
                }

                result.total = mat + fiz + kim + bio;
                result.details = `MAT: ${mat} | FİZ: ${fiz} | KİM: ${kim} | BİO: ${bio}`;
            }

            if (editingExamId) {
                const idx = examData.findIndex(e => e.id === editingExamId);
                if (idx > -1) examData[idx] = result;
                cancelExamEdit();
            } else {
                examData.push(result);
            }

            examData.sort((a, b) => new Date(a.date) - new Date(b.date));
            saveAndRenderExams();
            if(!editingExamId) triggerConfetti();
        }

        function deleteExam(id) {
            if (confirm('Bu deneme sonucunu silmek istediğine emin misin?')) {
                examData = examData.filter(e => e.id !== id);
                saveAndRenderExams();
            }
        }

        function saveAndRenderExams() {
            saveToCloudAndLocal('yks_exam_data', examData);
            renderExams();
        }

        function renderExams() {
            const list = document.getElementById('examHistoryList');
            if (!list) return;
            list.innerHTML = '';

            if (examData.length === 0) {
                list.innerHTML = '<div class="empty-text">Henüz kaydedilmiş deneme yok.</div>';
                renderExamChart();
                return;
            }

            let sortedForList = [...examData].sort((a, b) => new Date(b.date) - new Date(a.date));

            sortedForList.forEach(item => {
                list.innerHTML += `
                    <div class="camp-card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; padding:12px;">
                        <div>
                            <div style="display:flex; gap:8px; align-items:center; margin-bottom:2px;">
                                <span class="course-badge" style="font-size:10px; padding:2px 6px;">${escapeHtml(item.type)}</span>
                                <span style="font-weight:700; font-size:14px;">${escapeHtml(item.name)}</span>
                            </div>
                            <div style="font-size:12px; color:var(--subtext-color);">${formatDateForDisplay(item.date)} | ${escapeHtml(item.details)}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="text-align:right;">
                                <span style="font-size:11px; color:var(--subtext-color); display:block;">Toplam Net</span>
                                <span style="font-size:16px; font-weight:800; color:var(--accent-color);">${item.total.toFixed(2)}</span>
                            </div>
                            <div style="display:flex; gap:4px;">
                                <button class="delete-btn" onclick="editExam(${item.id})" style="padding:4px 8px; background:var(--input-bg); border:1px solid var(--border-color);">Düzenle</button>
                                <button class="delete-btn" onclick="deleteExam(${item.id})">Sil</button>
                            </div>
                        </div>
                    </div>`;
            });

            renderExamChart();
        }

        function renderExamChart() {
            const canvas = document.getElementById('examChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            let filteredExams = examData.filter(e => {
                if (currentExamChartFilter === 'ALL') return true;
                return e.type === currentExamChartFilter;
            });

            const labels = filteredExams.map(e => `${e.name} (${formatDateForDisplay(e.date)})`);
            const totals = filteredExams.map(e => e.total);

            if (examChartInstance) {
                examChartInstance.destroy();
            }

            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const textColor = isDark ? '#f1f5f9' : '#2c3e50';
            const gridColor = isDark ? '#334155' : '#e2e8f0';

            examChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${currentExamChartFilter === 'ALL' ? 'Tüm Denemeler' : currentExamChartFilter} Net Gelişimi`,
                        data: totals,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 3,
                        pointBackgroundColor: '#10b981',
                        pointRadius: 5,
                        fill: true,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor, font: { weight: 'bold' } } }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor }, beginAtZero: false }
                    }
                }
            });
        }

        /* ================= SAYAÇ (POMODORO / ÖZEL SÜRE) ================= */
        let pomoTimer = null;
        let pomoTotalSeconds = 25 * 60;
        let pomoRemainingSeconds = 25 * 60;
        let isPomoRunning = false;

        function updatePomoDisplay() {
            const h = Math.floor(pomoRemainingSeconds / 3600);
            const m = Math.floor((pomoRemainingSeconds % 3600) / 60);
            const s = pomoRemainingSeconds % 60;
            const displayStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            const dispEl = document.getElementById('pomodoroDisplay');
            if (dispEl) dispEl.innerText = displayStr;
            document.title = isPomoRunning ? `(${displayStr}) YKS Sistemim` : 'YKS Sistemim';
        }

        function togglePomodoro() {
            const startBtn = document.getElementById('pomoStartBtn');
            const configArea = document.getElementById('pomoConfigArea');

            if (!isPomoRunning) {
                if (pomoRemainingSeconds === pomoTotalSeconds) {
                    const h = parseInt(document.getElementById('pomoHours').value) || 0;
                    const m = parseInt(document.getElementById('pomoMinutes').value) || 0;
                    const s = parseInt(document.getElementById('pomoSeconds').value) || 0;
                    pomoTotalSeconds = (h * 3600) + (m * 60) + s;
                    pomoRemainingSeconds = pomoTotalSeconds;

                    if (pomoTotalSeconds <= 0) {
                        alert('Lütfen geçerli bir süre girin!');
                        return;
                    }
                }

                if (configArea) configArea.style.display = 'none';
                isPomoRunning = true;
                startBtn.innerText = 'Duraklat';
                startBtn.style.backgroundColor = '#ef4444';

                pomoTimer = setInterval(() => {
                    if (pomoRemainingSeconds > 0) {
                        pomoRemainingSeconds--;
                        updatePomoDisplay();
                    } else {
                        clearInterval(pomoTimer);
                        isPomoRunning = false;
                        startBtn.innerText = 'Başlat';
                        startBtn.style.backgroundColor = 'var(--accent-color)';
                        if (configArea) configArea.style.display = 'flex';
                        triggerConfetti();
                        alert('Süre bitti, tebrikler!');
                    }
                }, 1000);
            } else {
                clearInterval(pomoTimer);
                isPomoRunning = false;
                startBtn.innerText = 'Devam Et';
                startBtn.style.backgroundColor = 'var(--accent-color)';
            }
        }

        function resetPomodoro() {
            clearInterval(pomoTimer);
            isPomoRunning = false;
            const startBtn = document.getElementById('pomoStartBtn');
            if (startBtn) {
                startBtn.innerText = 'Başlat';
                startBtn.style.backgroundColor = 'var(--accent-color)';
            }
            const configArea = document.getElementById('pomoConfigArea');
            if (configArea) configArea.style.display = 'flex';

            const h = parseInt(document.getElementById('pomoHours').value) || 0;
            const m = parseInt(document.getElementById('pomoMinutes').value) || 25;
            const s = parseInt(document.getElementById('pomoSeconds').value) || 0;
            pomoTotalSeconds = (h * 3600) + (m * 60) + s;
            pomoRemainingSeconds = pomoTotalSeconds;
            updatePomoDisplay();
        }

        document.getElementById('pomoHours').addEventListener('input', updatePomoInputValues);
        document.getElementById('pomoMinutes').addEventListener('input', updatePomoInputValues);
        document.getElementById('pomoSeconds').addEventListener('input', updatePomoInputValues);

        function updatePomoInputValues() {
            if (isPomoRunning) return;
            const h = parseInt(document.getElementById('pomoHours').value) || 0;
            const m = parseInt(document.getElementById('pomoMinutes').value) || 0;
            const s = parseInt(document.getElementById('pomoSeconds').value) || 0;
            pomoTotalSeconds = (h * 3600) + (m * 60) + s;
            pomoRemainingSeconds = pomoTotalSeconds;
            updatePomoDisplay();
        }
    </script>
</body>
</html>
